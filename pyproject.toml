[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luciddreamer"
version = "0.1.0"
description = "Maritime intelligence system — distills cloud AI into compiled edge tiles"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "SuperInstance", email = "forgemaster@superinstance.com"}]
keywords = ["maritime", "autonomous", "compilation", "tiles", "edge-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

[project.optional-dependencies]
vision = ["Pillow>=10.0", "numpy>=1.24"]
audio = ["pyttsx3>=2.90"]
chart = ["Pillow>=10.0", "numpy>=1.24"]
all = ["Pillow>=10.0", "numpy>=1.24", "pyttsx3>=2.90"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
luciddreamer = "luciddreamer.cli:main"

[project.entry-points."superinstance.plugins"]
luciddreamer = "luciddreamer.mesh:register"

[tool.setuptools.packages.find]
include = ["luciddreamer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
